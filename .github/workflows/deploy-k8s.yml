# Single-workflow CI/CD: build image -> push to GHCR -> bump tag in the
# server-infrastructure repo (ArgoCD then syncs to the cluster).
#
# Required in this repo (Settings -> Secrets and variables -> Actions):
#   Secret   INFRA_APP_ID               - GitHub App "infra-deployer" App ID
#   Secret   INFRA_APP_PRIVATE_KEY      - that App's private key (.pem contents)
#   Variable APP_NAME                   - dir name under apps/ in infra (app-wounds)
#   Variable NEXT_PUBLIC_GOOGLE_CLIENT_ID - Google OAuth client id baked into the bundle
#
# The infra-deployer GitHub App must be installed on the server-infrastructure
# repo with Contents: Read and write.
name: Build, Push and Deploy

on:
  push:
    branches:
      - feat/k8-auto-deploy
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Next.js inlines NEXT_PUBLIC_* at build time:
          build-args: |
            NEXT_PUBLIC_API_URL=https://server-wounds.ak8s.ic.unicamp.br
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}

      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.INFRA_APP_ID }}
          private-key: ${{ secrets.INFRA_APP_PRIVATE_KEY }}
          owner: datasci4citizens
          repositories: server-infrastructure

      - name: Checkout infra repo
        uses: actions/checkout@v4
        with:
          repository: datasci4citizens/server-infrastructure
          token: ${{ steps.app-token.outputs.token }}
          ref: main
          path: infra

      - name: Bump image tag in infra
        working-directory: infra
        run: |
          SHA_TAG="sha-${GITHUB_SHA::7}"
          cd "apps/${{ vars.APP_NAME }}/overlays/prod"
          sed -i "s|newTag: .*|newTag: ${SHA_TAG}|" kustomization.yaml
          git config user.name "infra-deployer[bot]"
          git config user.email "infra-deployer[bot]@users.noreply.github.com"
          git add kustomization.yaml
          git diff --cached --quiet || git commit -m "chore: bump ${{ vars.APP_NAME }} image to ${SHA_TAG}"
          git push
